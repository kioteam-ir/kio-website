name: Notify Repo Events

on:
  push:
  issues:
    types:
      - opened
      - closed
      - reopened
  issue_comment:
    types:
      - created
  pull_request:
    types:
      - opened
      - closed
      - reopened
  pull_request_review_comment:
    types:
      - created
  release:
    types:
      - published

jobs:
  notify:
    uses: kioteam-ir/kio-github-actions/.github/workflows/notify-events.yml@v1
    secrets:
      TELEGRAM_TO: ${{ secrets.TELEGRAM_TO }}
      TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
