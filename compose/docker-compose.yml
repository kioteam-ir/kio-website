name: kio

services:
  api:
    build:
      context: ..
      dockerfile: docker/backend/Dockerfile
    env_file:
      - ../.env
    networks:
      - kioteam_network

  web:
    build:
      context: ..
      dockerfile: docker/frontend/Dockerfile
      target: production
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
    depends_on:
      api:
        condition: service_healthy
    networks:
      - kioteam_network


networks:
  kioteam_network:
    external: true
