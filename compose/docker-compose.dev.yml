services:
  api:
    ports:
      - "${API_PORT:-8000}:8000"
    environment:
      # Reload is handled by the entrypoint script below.
      UVICORN_RELOAD: "true"
    volumes:
      - ../backend/app:/app/app:rw
      - ../backend/alembic:/app/alembic:rw
      - ../backend/alembic.ini:/app/alembic.ini:rw
      - ../backend/scripts:/app/scripts:ro
    # Runs the repo entrypoint so startup logic (dependency wait + migration
    # retries) can change without rebuilding the image. The production image
    # bakes the same script in through docker/backend/Dockerfile.
    command: bash /app/scripts/start.sh

  web:
    build:
      target: dev
    ports:
      - "${WEB_PORT:-5173}:5173"
    environment:
      - CHOKIDAR_USEPOLLING=true
    volumes:
      - ../frontend:/app
      - web_node_modules:/app/node_modules

  db:
    ports:
      - "${DB_PORT:-5432}:5432"

  redis:
    ports:
      - "${REDIS_PORT:-6379}:6379"

volumes:
  web_node_modules:
