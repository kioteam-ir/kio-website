services:
  api:
    ports:
      - "${API_PORT:-8000}:8000"
    environment:
      DEBUG: "true"
    volumes:
      - ../backend/app:/app/app:ro
    command:
      - uvicorn
      - app.main:create_app
      - --factory
      - --host
      - "0.0.0.0"
      - --port
      - "8000"
      - --reload

  web:
    build:
      target: dev
    ports:
      - "${WEB_PORT:-5173}:5173"
    environment:
      - CHOKIDAR_USEPOLLING=true
    volumes:
      - ../frontend:/app
      - web_node_modules:/app/node_modules

  db:
    ports:
      - "${DB_PORT:-5432}:5432"

  redis:
    ports:
      - "${REDIS_PORT:-6379}:6379"

volumes:
  web_node_modules:
