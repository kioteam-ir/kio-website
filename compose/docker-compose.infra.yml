# Optional local infrastructure. Skip this file when using external PostgreSQL/Redis.

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${DB_USER:-kio}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-change-me}
      POSTGRES_DB: ${DB_NAME:-kio}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-kio} -d ${DB_NAME:-kio}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - kio

  redis:
    image: redis:8-alpine
    command: redis-server --save "" --appendonly no
    networks:
      - kio

  api:
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - kio

volumes:
  pgdata:

networks:
  kio:
    name: kio
