user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log notice;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                     '$status $body_bytes_sent "$http_referer" '
                     '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;

    gzip on;
    gzip_vary on;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml application/xml+rss text/javascript;

    # Don't leak Nginx version in headers/error pages.
    server_tokens off;

    # Shared rate-limit zone. Any per-service config can opt in with:
    #   limit_req zone=general_limit burst=20 nodelay;
    limit_req_zone $binary_remote_addr zone=general_limit:10m rate=10r/s;

    # One file per service/domain lives in conf.d/. Drop a new file in
    # there (and add the matching upstream service to docker-compose.yml)
    # to plug in another service without touching anything else.
    include /etc/nginx/conf.d/*.conf;
}
