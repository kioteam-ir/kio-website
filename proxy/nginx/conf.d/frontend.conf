# Website frontend - main domain (kioteam.ir)
# Point this at your actual frontend service: a container name on the
# shared "kioteam_network" (e.g. "frontend:3000"), or a host/IP:port
# if it runs elsewhere (e.g. "192.168.1.10:3000").

upstream frontend_upstream {
    server frontend:5173;
}

server {
    listen 80;
    listen [::]:80;
    server_name kioteam.ir www.kioteam.ir;

    limit_req zone=general_limit burst=20 nodelay;

    access_log /var/log/nginx/frontend.access.log main;
    error_log  /var/log/nginx/frontend.error.log;

    location / {
        proxy_pass http://frontend_upstream;
        include /etc/nginx/snippets/proxy-params.conf;
    }
}
