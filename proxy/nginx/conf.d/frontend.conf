# Website frontend - main domain (kioteam.ir)
upstream frontend_upstream {
    server frontend:5173;
}

server {
    listen 80;
    listen [::]:80;
    server_name kioteam.ir www.kioteam.ir;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://kioteam.ir$request_uri;
    }
    
    location /api/ {
        proxy_pass http://backend:8000;
        include /etc/nginx/snippets/proxy-params.conf;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name kioteam.ir;

    ssl_certificate     /etc/letsencrypt/live/kioteam.ir/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kioteam.ir/privkey.pem;
    include /etc/nginx/snippets/ssl-params.conf;

    limit_req zone=general_limit burst=20 nodelay;

    access_log /var/log/nginx/frontend.access.log main;
    error_log  /var/log/nginx/frontend.error.log;

    location / {
        proxy_pass http://frontend_upstream;
        include /etc/nginx/snippets/proxy-params.conf;
    }
}
