version: "3.9"

services:
  react-dev:
    build:
      context: .
    container_name: frontend
    ports:
      - "5173:5173"
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true
    networks:
      - kioteam_network

networks:
  kioteam_network:
    external: true
