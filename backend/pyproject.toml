[project]
name = "kio-backend"
version = "0.1.0"
description = "KIO website modular monolith API"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.19.0",
    "asyncpg>=0.31.0",
    "crudadmin>=0.4.3",
    "fastapi-pagination>=0.15.16",
    "fastapi-redis-sdk>=0.8.0",
    "fastapi[standard]>=0.115.0",
    "pydantic-settings>=2.12.0",
    "pydantic[email]>=2.12.0",
    "python-jose[cryptography]>=3.5.0",
    "redis[hiredis]>=7.2.0",
    "sqlmodel>=0.0.27",
    "structlog>=25.5.0",
    "uvicorn[standard]>=0.38.0",
]

[dependency-groups]
dev = [
    "aiosqlite>=0.21.0",
    "httpx>=0.28.0",
    "mypy>=1.19.0",
    "pytest>=9.0.0",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.14.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["app", "tests", "scripts"]

[tool.ruff.lint]
select = [
    "E", "F", "I", "N", "UP", "B", "A", "C4", "SIM", "TCH", "RUF",
]

[tool.ruff.lint.per-file-ignores]
"app/**/router.py" = ["B008"]
"app/**/dependencies.py" = ["B008"]
"app/**/service.py" = ["B008"]
"tests/**" = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.mypy]
python_version = "3.13"
strict = true
warn_unreachable = true
warn_unused_configs = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["crudadmin.*", "jose.*"]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
