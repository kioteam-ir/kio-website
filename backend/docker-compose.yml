version: "3.9"

services:

  postgres:
    image: postgres:17.5-alpine3.22
    restart: unless-stopped

    env_file:
      - ".env.dev"

    ports:
      - "5433:5432"

    volumes:
      - kio_pgdata:/var/lib/postgresql/data

    networks:
      - kio_net

    # healthcheck:
    #   test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
    #   interval: 5s
    #   timeout: 5s
    #   retries: 20


  accounts:
    build:
      context: .
      dockerfile: ./accounts/Dockerfile
    
    env_file:
      - ".env.dev"

    ports:
      - "8001:8000"

    depends_on:
      - postgres

    networks:
      - kio_net

    # healthcheck:
    #   test: ["CMD", "wget", "--spider", "http://127.0.0.1:8000/docs"]
    #   interval: 15s
    #   timeout: 5s
    #   retries: 5


  projects:
    build:
      context: .
      dockerfile: ./projects/Dockerfile

    env_file:
      - ".env.dev"

    ports:
      - "8002:8000"

    depends_on:
      - postgres

    networks:
      - kio_net

    # healthcheck:
    #   test: ["CMD", "wget", "--spider", "http://127.0.0.1:8000/docs"]
    #   interval: 15s
    #   timeout: 5s
    #   retries: 5


  gateway:
    build:
      context: .
      dockerfile: ./gateway/Dockerfile

    ports:
      - "8000:8000"

    depends_on:
      - accounts
      - projects

    networks:
      - kio_net


volumes:
  kio_pgdata:

networks:
  kio_net:
    driver: bridge