version: "3.9"

services:

  postgres:
    image: postgres:17.5-alpine3.22
    restart: unless-stopped

    env_file:
      - ".env.dev"

    ports:
      - "5433:5432"

    volumes:
      - kio_pgdata:/var/lib/postgresql/data

    networks:
      - kio_net


  accounts:
    build:
      context: .
      dockerfile: ./accounts/Dockerfile
    
    env_file:
      - ".env.dev"

    ports:
      - "8001:8000"

    depends_on:
      - postgres

    networks:
      - kio_net

  blog:
    build:
      context: .
      dockerfile: ./blog/Dockerfile
    
    env_file:
      - ".env.dev"

    ports:
      - "8003:8000"

    depends_on:
      - postgres

    networks:
      - kio_net


  projects:
    build:
      context: .
      dockerfile: ./projects/Dockerfile

    env_file:
      - ".env.dev"

    ports:
      - "8002:8000"

    depends_on:
      - postgres

    networks:
      - kio_net


  gateway:
    build:
      context: .
      dockerfile: ./gateway/Dockerfile

    ports:
      - "8000:8000"

    depends_on:
      - accounts
      - projects

    networks:
      - kio_net


volumes:
  kio_pgdata:

networks:
  kio_net:
    driver: bridge