version: "3.9"

services:
  gateway:
    build:
      context: ./backend
      dockerfile: gateway/Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env.dev
    depends_on:
      - blog
      - accounts
      - db

  blog:
    build:
      context: ./backend
      dockerfile: blog/Dockerfile
    env_file:
      - ./backend/.env.dev
    depends_on:
      - db

  accounts:
    build:
      context: ./backend
      dockerfile: accounts/Dockerfile
    env_file:
      - ./backend/.env.dev
    depends_on:
      - db

  db:
    image: postgres:17.5-alpine3.22
    env_file:
      - ./backend/.env.dev
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

volumes:
  postgres_data:
