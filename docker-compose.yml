# "Fullstack" local setup: runs the backend microservices plus a single
# combined container that serves both the gateway API and the frontend
# dev server (see app/Dockerfile).
#
# This is a lighter alternative to docker-compose.local.yml, which runs
# the gateway and the frontend as separate containers instead.
#
# Run with:
#   docker compose up --build

networks:
  kio_net:
    driver: bridge
  kioteam_network:
    external: true

services:
  kio-base:
    build:
      context: ./backend
      dockerfile: base.Dockerfile
    image: kio-base:latest

  redis:
    image: redis:8.4-alpine
    env_file:
      - ./backend/.env.global
    networks:
      - kio_net

  accounts-db:
    image: postgres:17.5-alpine3.22
    env_file:
      - ./backend/accounts/config/.env
    networks:
      - kio_net

  accounts:
    build:
      context: ./backend
      dockerfile: ./accounts/Dockerfile
    env_file:
      - ./backend/accounts/config/.env
      - ./backend/.env.global
    depends_on:
      - kio-base
      - accounts-db
    networks:
      - kio_net

  blog-db:
    image: postgres:17.5-alpine3.22
    env_file:
      - ./backend/blog/config/.env
    networks:
      - kio_net

  blog:
    build:
      context: ./backend
      dockerfile: ./blog/Dockerfile
    env_file:
      - ./backend/blog/config/.env
      - ./backend/.env.global
    depends_on:
      - kio-base
      - blog-db
    networks:
      - kio_net

  projects-db:
    image: postgres:17.5-alpine3.22
    env_file:
      - ./backend/projects/config/.env
    networks:
      - kio_net

  projects:
    build:
      context: ./backend
      dockerfile: ./projects/Dockerfile
    env_file:
      - ./backend/projects/config/.env
      - ./backend/.env.global
    depends_on:
      - kio-base
      - projects-db
    networks:
      - kio_net

  fullstack:
    build:
      context: .
      dockerfile: app/Dockerfile
    container_name: fullstack
    depends_on:
      - kio-base
      - accounts
      - projects
      - blog
      - redis
    environment:
      - CHOKIDAR_USEPOLLING=true
    ports:
      - "8000:8000"
      - "5173:5173"
    networks:
      kio_net: {}
      kioteam_network:
        aliases:
          - backend
          - frontend
